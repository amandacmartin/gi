<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Gestão Industrial - Conceitos Básicos de Custos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .student-info {
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }

        .student-info label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .student-info input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .table-container {
            overflow-x: auto;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: var(--primary);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.selected-correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
            font-weight: 600;
        }

        .option-btn.selected-incorrect {
            background-color: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .status-badge.correct {
            background-color: var(--success);
            color: white;
        }

        .status-badge.incorrect {
            background-color: var(--danger);
            color: white;
        }

        .results-panel {
            display: none;
            background: #f8fafc;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-top: 30px;
        }

        .results-panel h2 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            margin: 15px 0;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 15px;
        }

        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

let userAnswers = {};

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let html = `<div class="question-title">${index + 1}. ${q.title}</div>`;

        if (q.tableHtml) {
            html += `<div class="table-container">${q.tableHtml}</div>`;
        }

        if (q.extraText) {
            html += `<div class="question-title" style="margin-top: 10px;">${q.extraText}</div>`;
        }

        html += `<div class="options-list" id="options-q${q.id}">`;

        q.options.forEach((opt, optIndex) => {
            html += `
                <button class="option-btn" 
                        onclick="selectOption(${q.id}, ${optIndex})" 
                        id="btn-q${q.id}-opt${optIndex}">
                    <span>${opt.text}</span>
                    <span class="badge-container"></span>
                </button>
            `;
        });

        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);
    });
}

function selectOption(questionId, optionIndex) {
    if (userAnswers[questionId] !== undefined) return;

    userAnswers[questionId] = optionIndex;

    const question = quizData.find(q => q.id === questionId);
    const selectedOpt = question.options[optionIndex];
    const isCorrect = selectedOpt.correct;

    const optionsContainer = document.getElementById(`options-q${questionId}`);
    const buttons = optionsContainer.querySelectorAll('.option-btn');

    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === optionIndex) {
            const badge = btn.querySelector('.badge-container');
            if (isCorrect) {
                btn.classList.add('selected-correct');
                badge.innerHTML = `<span class="status-badge correct">Certo</span>`;
            } else {
                btn.classList.add('selected-incorrect');
                badge.innerHTML = `<span class="status-badge incorrect">Errado</span>`;
            }
        }
    });

    checkCompletion();
}

function checkCompletion() {
    if (Object.keys(userAnswers).length === quizData.length) {
        showResults();
    }
}

function showResults() {
    let score = 0;
    quizData.forEach(q => {
        const selectedIndex = userAnswers[q.id];
        if (selectedIndex !== undefined && q.options[selectedIndex].correct) {
            score++;
        }
    });

    const percentage = Math.round((score / quizData.length) * 100);
    const nameInput = document.getElementById('studentName').value.trim();

    document.getElementById('result-name').innerText = nameInput ? `Aluno(a): ${nameInput}` : '';
    document.getElementById('score-percentage').innerText = `${percentage}%`;
    document.getElementById('score-details').innerText = `Você acertou ${score} de ${quizData.length} questões.`;

    const resultsPanel = document.getElementById('results-panel');
    resultsPanel.style.display = 'block';
    resultsPanel.scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
    userAnswers = {};
    document.getElementById('results-panel').style.display = 'none';
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
