<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Industrial</title>
    
    <!-- Fonte Inter e Ícones Lucide -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 12px;
            background: linear-gradient(to right, #ffffff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 28px 24px;
            text-decoration: none;
            color: var(--text-main);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            background-color: var(--card-hover);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .card-swot .card-icon {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .card-quiz .card-icon {
            background-color: rgba(139, 92, 246, 0.15);
            color: var(--accent-purple);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.925rem;
            line-height: 1.5;
        }

        .arrow-icon {
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s ease;
        }

        .card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-badge">
                <i data-lucide="factory" size="16"></i>
                Painel do Aluno / Gestor
            </div>
            <h1>Gestão Industrial</h1>
            <p class="subtitle">Escolha um módulo abaixo para iniciar suas atividades:</p>
        </div>

        <div class="menu-grid">
            <a href="./swot.html" class="card card-swot">
                <div>
                    <div class="card-icon">
                        <i data-lucide="layout-grid" size="24"></i>
                    </div>
                    <div class="card-title">
                        Análise SWOT
                        <i data-lucide="arrow-right" class="arrow-icon" size="20"></i>
                    </div>
                    <p class="card-description">Mapeie Forças, Oportunidades, Fraquezas e Ameaças da operação.</p>
                </div>
            </a>

            <a href="./estrategia.html" class="card card-quiz">
                <div>
                    <div class="card-icon">
                        <i data-lucide="brain-circuit" size="24"></i>
                    </div>
                    <div class="card-title">
                        Quiz - Estratégia
                        <i data-lucide="arrow-right" class="arrow-icon" size="20"></i>
                    </div>
                    <p class="card-description">Teste seus conhecimentos sobre Estratégia de Produção e Operações.</p>
                </div>
            </a>
        </div>
    </div>

    <!-- Inicialização dos Ícones -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
